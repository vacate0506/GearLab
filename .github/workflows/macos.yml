name: Build macOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'flutter_app/**'
      - '.github/workflows/macos.yml'

permissions:
  contents: read

concurrency:
  group: gearlab-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS (Apple Silicon)
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze

      - name: Test
        working-directory: flutter_app
        run: flutter test

      - name: Build release
        working-directory: flutter_app
        run: flutter build macos --release

      - name: Verify app bundle
        working-directory: flutter_app
        run: |
          test -d "build/macos/Build/Products/Release/GearLab.app"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" \
            "build/macos/Build/Products/Release/GearLab.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
            "build/macos/Build/Products/Release/GearLab.app/Contents/Info.plist"

      - name: Launch smoke test
        working-directory: flutter_app
        run: |
          APP="build/macos/Build/Products/Release/GearLab.app"
          open "$APP"
          sleep 8
          if ! pgrep -x GearLab >/dev/null; then
            echo "GearLab did not stay running"
            exit 1
          fi
          osascript -e 'tell application "GearLab" to quit' || true

      - name: Package
        working-directory: flutter_app
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/GearLab.app"
          mkdir -p dist
          codesign --force --deep --sign - --entitlements macos/Runner/Release.entitlements "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/GearLab-macOS-1.0-arm64.zip"
          hdiutil create \
            -volname "GearLab" \
            -srcfolder "$APP" \
            -ov -format UDZO \
            "dist/GearLab-macOS-1.0-arm64.dmg"
          shasum -a 256 dist/* | tee dist/SHA256SUMS-macOS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GearLab-macOS-1.0-arm64
          path: |
            flutter_app/dist/GearLab-macOS-1.0-arm64.zip
            flutter_app/dist/GearLab-macOS-1.0-arm64.dmg
            flutter_app/dist/SHA256SUMS-macOS.txt
          if-no-files-found: error
          retention-days: 30
